<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | 株式会社SHINE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 60px;
            margin-top: 50px;
        }
        .contact-info {
            background: #F5F5F7;
            padding: 40px;
            border-radius: 20px;
            height: fit-content;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #D4AF37;
        }
        @media (max-width: 768px) {
            .contact-wrapper { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<header class="header">
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1><a href="/" th:text="${companyInfo.name}">SHINE</a></h1>
            </div>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link">ホーム</a></li>
                <li><a href="/message" class="nav-link">代表メッセージ</a></li>
                <li><a href="/contact" class="nav-link btn-contact active">お問い合わせ</a></li>
            </ul>
        </div>
    </nav>
</header>

<section style="background: linear-gradient(135deg, #0A0E27 0%, #1A1A1A 100%); color: white; padding: 150px 0 80px; text-align: center; margin-top: 80px;">
    <div class="container">
        <h1 style="font-size: 3rem; margin-bottom: 20px;">お問い合わせ</h1>
        <p style="font-size: 1.1rem;">ご質問・ご相談はこちらから</p>
    </div>
</section>

<section style="padding: 100px 0;">
    <div class="container">
        <div class="contact-wrapper">
            <div class="contact-info">
                <h3 style="font-size: 1.5rem; margin-bottom: 30px;">お問い合わせ先</h3>
                <div style="margin-bottom: 30px;">
                    <h4 style="color: #D4AF37; margin-bottom: 10px;">📍 所在地</h4>
                    <p th:text="${companyInfo.address}">東京都八王子市東町11-2 千島ビル4階</p>
                </div>
                <div style="margin-bottom: 30px;">
                    <h4 style="color: #D4AF37; margin-bottom: 10px;">📞 電話番号</h4>
                    <p th:text="${companyInfo.phone}">042-649-3516</p>
                </div>
                <div>
                    <h4 style="color: #D4AF37; margin-bottom: 10px;">✉️ メールアドレス</h4>
                    <p><a th:href="'mailto:' + ${companyInfo.email}" th:text="${companyInfo.email}" style="color: #D4AF37;">info@shine-corp.co.jp</a></p>
                </div>
            </div>

            <div class="contact-form">
                <form action="/contact/submit" method="post">
                    <div class="form-group">
                        <label for="category">お問い合わせ種別 <span style="color: #e74c3c;">*</span></label>
                        <select id="category" name="category" required>
                            <option value="">選択してください</option>
                            <option value="general">一般的なお問い合わせ</option>
                            <option value="business">事業・取引に関するお問い合わせ</option>
                            <option value="recruit">採用に関するお問い合わせ</option>
                            <option value="other">その他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="name">お名前 <span style="color: #e74c3c;">*</span></label>
                        <input type="text" id="name" name="name" required placeholder="山田 太郎">
                    </div>

                    <div class="form-group">
                        <label for="email">メールアドレス <span style="color: #e74c3c;">*</span></label>
                        <input type="email" id="email" name="email" required placeholder="example@email.com">
                    </div>

                    <div class="form-group">
                        <label for="message">お問い合わせ内容 <span style="color: #e74c3c;">*</span></label>
                        <textarea id="message" name="message" rows="8" required placeholder="お問い合わせ内容をご記入ください"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 18px; font-size: 18px;">送信する</button>
                </form>
            </div>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p>&copy; 2024 <span th:text="${companyInfo.name}">株式会社SHINE</span>. All Rights Reserved.</p>
    </div>
</footer>
</body>
</html>
